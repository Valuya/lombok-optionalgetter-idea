name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build plugin (version from the tag)
        run: ./gradlew buildPlugin -PpluginVersion="${GITHUB_REF_NAME#v}" --no-daemon
      - name: Create / update the GitHub release with the plugin zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/distributions/*.zip \
            --title "$GITHUB_REF_NAME" --generate-notes --latest \
          || gh release upload "$GITHUB_REF_NAME" build/distributions/*.zip --clobber
