name: Publish to JetBrains Marketplace

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Publish plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "${PUBLISH_TOKEN:-}" ]; then
            echo "::warning::PUBLISH_TOKEN not set — skipping Marketplace publish."
            echo "Create a token at https://plugins.jetbrains.com/author/me/tokens and add it as the PUBLISH_TOKEN secret."
            exit 0
          fi
          ./gradlew publishPlugin --no-daemon
